<!DOCTYPE html>
<html>

<head>
    <title>WaterWise - Home Details</title>

    <style>

        body {
            font-family: Arial;
            margin: 0;
            background-color: #e6f7ff;
        }

        header {
            background-color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            color: #176b87;
            margin: 0;
        }

        .main {
            background-color: #cceeff;
            padding: 50px;
            text-align: center;
            min-height: 100vh;
        }

        .box {
            background-color: white;
            width: 400px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            color: #0b3d91;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #176b87;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0f4c5c;
        }

        #message {
            color: green;
            margin-top: 15px;
        }

    </style>

</head>

<body>

    <header>
        <h1>WaterWise</h1>
    </header>

    <div class="main">

        <h2>Home Details Page</h2>
        <p>Household Info</p>

        <div class="box">

            <form id="homeForm">

                <label>Number of people in household</label>
                <input type="number" id="people" required>

                <label>Average shower time (minutes)</label>
                <input type="number" id="shower" required>

                <label>Laundry loads per week</label>
                <input type="number" id="laundry" required>

                <label>House type</label>

                <select id="houseType" required>
                    <option value="">Select</option>
                    <option>House</option>
                    <option>Apartment</option>
                    <option>Townhouse</option>
                </select>

                <button type="submit">Submit</button>

            </form>

            <p id="message"></p>

        </div>

    </div>

    <script>

        document.getElementById("homeForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let people = document.getElementById("people").value;

            document.getElementById("message").innerHTML =
            "Household details saved for " + people + " people.";

        });

    </script>

</body>

</html>
